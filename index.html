<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JustClean Employee Tracker</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
:root {
    --purple: #6f42c1;
    --black: #000000;
    --white: #ffffff;
}
body {
    background-color: var(--white);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 20px;
}
h2 { color: var(--purple); text-align:center; margin-bottom:20px; }
.card { margin-bottom: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
.btn-purple { background-color: var(--purple); color: var(--white); }
.btn-purple:hover { background-color: #5a32a3; }
.table thead { background-color: var(--purple); color: var(--white); }
.table-striped tbody tr:nth-of-type(odd) { background-color: #f2e6ff; }
.result { font-weight: bold; text-align: center; font-size: 1.2rem; margin-top: 10px; }
input[type="number"], input[type="text"] { font-size: 1rem; }
</style>
</head>
<body>

<div class="container">
    <h2>JustClean Company - Employee Utilization Tracker</h2>

    <!-- Employee Data Entry -->
    <div class="card p-3">
        <div class="row g-3">
            <div class="col-md-3">
                <input type="text" id="employeeName" class="form-control" placeholder="Employee Name">
            </div>
            <div class="col-md-3">
                <input type="number" id="hoursWorked" class="form-control" placeholder="Hours Worked">
            </div>
            <div class="col-md-3">
                <input type="number" id="breakHours" class="form-control" placeholder="Break Hours">
            </div>
            <div class="col-md-3">
                <button class="btn btn-purple w-100" id="calculateBtn">Calculate Net Hours</button>
            </div>
        </div>
        <div class="result alert alert-info mt-3" id="resultDiv" style="display:none;">
            Net Hours: <span id="netHours">0</span> hours
        </div>
    </div>

    <!-- CSV Upload -->
    <div class="card p-3">
        <label for="csvFile">Upload Calls CSV (Name, Call Duration in hours, Calls Count, Answer, Not Answer)</label>
        <input type="file" id="csvFile" class="form-control mb-2">
        <button class="btn btn-purple w-100" id="uploadBtn">Upload & Analyze</button>
        <div class="result alert alert-success mt-3" id="uploadResult" style="display:none;"></div>
        <div class="result alert alert-danger mt-3" id="uploadError" style="display:none;"></div>
    </div>

    <!-- Data Table -->
    <div class="card p-3">
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Hours Worked</th>
                    <th>Break Hours</th>
                    <th>Net Hours</th>
                    <th>Total Call Duration (Original)</th>
                    <th>Total Calls</th>
                    <th>Answer</th>
                    <th>Not Answer</th>
                    <th>Enhanced Duration (with Buffer per Call)</th>
                    <th>Utilization % (Original)</th>
                    <th>Occupation % (with Buffer)</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="dataTableBody"></tbody>
        </table>
        <button class="btn btn-purple mt-2" id="exportBtn">Export to CSV</button>
        <button class="btn btn-danger mt-2" id="clearAllBtn">Clear All</button>
    </div>

</div>

<script>
let employeeData = [];

function displayTable() {
    const tbody = document.getElementById('dataTableBody');
    tbody.innerHTML = '';
    employeeData.forEach((e,i)=>{
        // Automatic Buffer per Call: Add to Duration
        const bufferPerAnswer = e.answer * (5 / 60); // 5 min per answered call
        const bufferPerNotAnswer = e.notAnswer * (2 / 60); // 2 min per not answered call
        const totalBuffer = bufferPerAnswer + bufferPerNotAnswer;
        const enhancedDuration = e.totalDuration + totalBuffer; // Add buffer to each call's period
        const util = e.netHours > 0 ? (e.totalDuration / e.netHours * 100).toFixed(2) : 0; // Original Utilization
        const occ = e.netHours > 0 ? (enhancedDuration / e.netHours * 100).toFixed(2) : 0; // Occupation with Buffer
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>${e.name}</td>
            <td>${e.hoursWorked}</td>
            <td>${e.breakHours}</td>
            <td>${e.netHours}</td>
            <td>${e.totalDuration.toFixed(2)}</td>
            <td>${e.totalCalls}</td>
            <td>${e.answer}</td>
            <td>${e.notAnswer}</td>
            <td>${enhancedDuration.toFixed(2)} (Buffer: ${totalBuffer.toFixed(2)} hrs)</td>
            <td>${util}%</td>
            <td>${occ}%</td>
            <td><button class="btn btn-danger btn-sm" onclick="deleteRow(${i})">Delete</button></td>
        `;
        tbody.appendChild(tr);
    });
}

function deleteRow(index){
    if(confirm('Delete this employee?')){
        employeeData.splice(index,1);
        displayTable();
    }
}

// Calculate Net Hours
document.getElementById('calculateBtn').addEventListener('click',()=>{
    const name=document.getElementById('employeeName').value.trim();
    const hours=parseFloat(document.getElementById('hoursWorked').value);
    const brk=parseFloat(document.getElementById('breakHours').value);
    if(!name || isNaN(hours)|| isNaN(brk) || brk>hours){ alert('Enter valid data'); return;}
    const net=hours-brk;
    document.getElementById('netHours').textContent=net.toFixed(2);
    document.getElementById('resultDiv').style.display='block';

    const existing = employeeData.find(e=>e.name.toLowerCase()===name.toLowerCase());
    if(existing){
        existing.hoursWorked=hours;
        existing.breakHours=brk;
        existing.netHours=net;
    }else{
        employeeData.push({name, hoursWorked:hours, breakHours:brk, netHours:net, totalDuration:0, totalCalls:0, answer:0, notAnswer:0});
    }
    displayTable();
});

// CSV Upload - Automatic Buffer Addition to Duration per Call
document.getElementById('uploadBtn').addEventListener('click',()=>{
    const file=document.getElementById('csvFile').files[0];
    if(!file){ alert('Select a CSV file'); return;}
    const reader=new FileReader();
    reader.onload=function(e){
        const lines=e.target.result.split(/\r?\n/);
        let processedCount = 0;
        lines.forEach(line=>{
            if(line.toLowerCase().includes('name')) return; // Skip header
            const parts=line.split(',');
            if(parts.length>=5){
                const name=parts[0].trim();
                const duration=parseFloat(parts[1])||0;
                const calls=parseInt(parts[2])||0;
                const ans=parseInt(parts[3])||0;
                const notAns=parseInt(parts[4])||0;
                const emp=employeeData.find(x=>x.name.toLowerCase()===name.toLowerCase());
                if(emp){
                    // Add original duration and counts
                    emp.totalDuration += duration;
                    emp.totalCalls += calls;
                    emp.answer += ans;
                    emp.notAnswer += notAns;
                    // Buffer is calculated automatically in displayTable (added to duration per call)
                    processedCount++;
                } else {
                    console.log(`Employee "${name}" not found in main data. Skipping.`);
                }
            }
        });
        displayTable(); // Updates with enhanced duration, Utilization, and Occupation
        document.getElementById('uploadResult').style.display='block';
        document.getElementById('uploadResult').textContent=`CSV processed successfully! Added buffer to each call duration for ${processedCount} lines. Utilization and Occupation calculated automatically.`;
        document.getElementById('uploadError').style.display='none';
    };
    reader.readAsText(file);
});

// Export CSV - Includes Enhanced Duration, Utilization, and Occupation with Buffer
document.getElementById('exportBtn').addEventListener('click',()=>{
    let csv='Name,Hours Worked,Break Hours,Net Hours,Total Call Duration (Original),Total Calls,Answer,Not Answer,Enhanced Duration (with Buffer),Utilization % (Original),Occupation % (with Buffer)\n';
    employeeData.forEach(e=>{
        // Automatic Buffer per Call in Export
        const bufferPerAnswer = e.answer * (5 / 60);
        const bufferPerNotAnswer = e.notAnswer * (2 / 60);
        const totalBuffer = bufferPerAnswer + bufferPerNotAnswer;
        const enhancedDuration = e.totalDuration + totalBuffer;
        const util = e.netHours > 0 ? (e.totalDuration / e.netHours * 100).toFixed(2) : 0; // Original
        const occ = e.netHours > 0 ? (enhancedDuration / e.netHours * 100).toFixed(2) : 0; // With Buffer
        csv+=`${e.name},${e.hoursWorked},${e.breakHours},${e.netHours},${e.totalDuration.toFixed(2)},${e.totalCalls},${e.answer},${e.notAnswer},${enhancedDuration.toFixed(2)},${util},${occ}\n`;
    });
    const blob=new Blob([csv],{type:'text/csv'});
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url; a.download='employee_utilization_occupation_with_buffer.csv'; a.click();
    URL.revokeObjectURL(url);
});

// Clear All
document.getElementById('clearAllBtn').addEventListener('click',()=>{
    if(confirm('Clear all data?')){
        employeeData=[];
        displayTable();
        document.getElementById('resultDiv').style.display='none';
        document.getElementById('uploadResult').style.display='none';
    }
});
</script>
</body>
</html>
